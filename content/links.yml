# Eigennamen, die die Seite selbst verlinkt: in Anleitungen, Wasserstandsmeldungen und im Text der Projektseiten jeweils
# dort, wo der Name auf einer Seite zum ersten Mal steht (nicht in Überschriften, Code oder schon verlinktem Text). Gilt
# für beide Sprachen. Regeln in CONTRIBUTING.md, Abschnitt „Eigennamen verlinken“.
#
#   - name: ESPHome               # so, wie er im Text steht (Groß- und Kleinschreibung zählt)
#     url: https://esphome.io/    # die offizielle Seite, immer https://
#     auch: [ESP Home]            # optional: weitere Schreibweisen
#     partner: true               # optional: Partnerlink (Affiliate); erscheint als „Anzeige“, siehe CONTRIBUTING.md

